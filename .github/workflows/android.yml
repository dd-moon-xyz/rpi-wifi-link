name: Build Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rpi-wifi-link-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish downloadable APK
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v8
        with:
          name: rpi-wifi-link-android-debug
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv release/app-debug.apk release/rpi-wifi-link.apk
          tag="build-$GITHUB_SHA"
          cat > release/notes.md <<EOF
          Built from commit $GITHUB_SHA.

          Android: download rpi-wifi-link.apk and install it on your phone (debug build for testing).
          iOS: download rpi-wifi-link.ipa. This App Store-signed package is installed through TestFlight, not directly.
          Each file appears after its platform build finishes successfully.
          EOF
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release/rpi-wifi-link.apk --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" release/rpi-wifi-link.apk \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "build ${GITHUB_SHA:0:7}" \
              --notes-file release/notes.md --latest
          fi
          echo "Download APK: https://github.com/$GH_REPO/releases/download/$tag/rpi-wifi-link.apk" >> "$GITHUB_STEP_SUMMARY"
