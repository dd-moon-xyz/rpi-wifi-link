name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SIGN_IOS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      BUNDLE_ID: xyz.ddmoon.rpiwifilink
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up signing tools
        if: env.SIGN_IOS == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install signing tools
        if: env.SIGN_IOS == 'true'
        run: python -m pip install 'codemagic-cli-tools==0.70.2'

      - name: Configure signing
        if: env.SIGN_IOS == 'true'
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: DZ8AMY8AC6
          APP_STORE_CONNECT_ISSUER_ID: 9d0b15d8-6286-472a-86ff-9cf8851b4195
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_DISTRIBUTION_PRIVATE_KEY }}
          APP_STORE_CONNECT_DISABLE_JWT_CACHE: 'true'
        run: |
          for name in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required iOS signing secret for $name. See the wiki testing guide."
              exit 1
            fi
          done
          keychain initialize --path "$RUNNER_TEMP/ios-signing.keychain-db"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --strict-match-identifier --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --certificates-dir "$RUNNER_TEMP/ios-certificates"
          keychain add-certificates --path "$RUNNER_TEMP/ios-signing.keychain-db" \
            --certificate "$RUNNER_TEMP/ios-certificates/*.p12"
          xcode-project use-profiles --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist "$RUNNER_TEMP/ios-export-options.plist"

      - name: Build signed IPA
        if: env.SIGN_IOS == 'true'
        run: flutter build ipa --release --build-number="$GITHUB_RUN_NUMBER" --export-options-plist="$RUNNER_TEMP/ios-export-options.plist"

      - name: Upload signed IPA artifact
        if: env.SIGN_IOS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rpi-wifi-link-ios-signed
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to App Store Connect for TestFlight
        if: env.SIGN_IOS == 'true'
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: DZ8AMY8AC6
          APP_STORE_CONNECT_ISSUER_ID: 9d0b15d8-6286-472a-86ff-9cf8851b4195
          APP_STORE_CONNECT_DISABLE_JWT_CACHE: 'true'
        run: app-store-connect publish --path 'build/ios/ipa/*.ipa' --beta-group internal

      - name: Remove temporary signing material
        if: always() && env.SIGN_IOS == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/ios-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db"
          fi
          rm -rf "$RUNNER_TEMP/ios-certificates"

      - name: Build without signing
        if: env.SIGN_IOS != 'true'
        run: flutter build ios --release --no-codesign

      - name: Package unsigned app
        if: env.SIGN_IOS != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/rpi-wifi-link-ios-unsigned.zip

      - name: Upload unsigned app
        if: env.SIGN_IOS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rpi-wifi-link-ios-unsigned
          path: mobile/build/ios/rpi-wifi-link-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish downloadable IPA
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@v8
        with:
          name: rpi-wifi-link-ios-signed
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv release/*.ipa release/rpi-wifi-link.ipa
          tag="build-$GITHUB_SHA"
          cat > release/notes.md <<EOF
          Built from commit $GITHUB_SHA.

          Android: download rpi-wifi-link.apk and install it on your phone (debug build for testing).
          iOS: download rpi-wifi-link.ipa. This App Store-signed package is installed through TestFlight, not directly.
          Each file appears after its platform build finishes successfully.
          EOF
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release/rpi-wifi-link.ipa --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" release/rpi-wifi-link.ipa \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "build ${GITHUB_SHA:0:7}" \
              --notes-file release/notes.md --latest
          fi
          echo "Download IPA: https://github.com/$GH_REPO/releases/download/$tag/rpi-wifi-link.ipa" >> "$GITHUB_STEP_SUMMARY"
