name: rpi_wifi_link
description: Raspberry Pi Wi-Fi provisioning UI prototype.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.6.0
  lucide_icons_flutter: ^4.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/lucide.txt
    - assets/licenses/jetbrains-mono.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
